name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run standalone analyzer
        run: go run ./cmd/loglint ./...

      - name: Build custom golangci-lint binary (manual)
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          GCL_DIR="$TMP_DIR/golangci-lint"

          git clone --branch v2.11.2 --single-branch --depth 1 https://github.com/golangci/golangci-lint.git "$GCL_DIR"

          cat > "$GCL_DIR/cmd/golangci-lint/plugins.go" <<'EOF'
          package main

          import (
          	_ "github.com/TSunset/golint/plugin"
          )
          EOF

          cd "$GCL_DIR"
          go mod edit -replace github.com/TSunset/golint="$GITHUB_WORKSPACE"
          go mod tidy
          go build -o "$GITHUB_WORKSPACE/custom-gcl" ./cmd/golangci-lint

      - name: Run custom golangci-lint
        run: ./custom-gcl run ./...
